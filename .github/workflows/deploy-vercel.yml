name: Deploy to Multiple Vercel Accounts

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.account }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - account: ENGIMIN 000
            token: VERCEL_TOKEN_ENGIMIN_000
            org_id: VERCEL_ORG_ID_ENGIMIN_000
            project_id: VERCEL_PROJECT_ID_ENGIMIN_000

          - account: ENGIMIN 001
            token: VERCEL_TOKEN_ENGIMIN_001
            org_id: VERCEL_ORG_ID_ENGIMIN_001
            project_id: VERCEL_PROJECT_ID_ENGIMIN_001

          - account: ENGIMIN 003
            token: VERCEL_TOKEN_ENGIMIN_003
            org_id: VERCEL_ORG_ID_ENGIMIN_003
            project_id: VERCEL_PROJECT_ID_ENGIMIN_003

    env:
      VERCEL_TOKEN: ${{ secrets[matrix.token] }}
      VERCEL_ORG_ID: ${{ secrets[matrix.org_id] }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Workaround untuk mencegah Vercel CLI
      # membaca metadata Git dari runner.
      - name: Remove Git Metadata
        run: rm -rf .git

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Production Environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build Production
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Deploy Production
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
